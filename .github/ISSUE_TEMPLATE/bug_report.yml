name: Bug report
description: Something in pycangui does not work the way the manual says it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected to happen, and what happened instead. Quote any message pycangui showed word for word.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps from starting pycangui to the problem, one per line, in order. Say if it happens every time or only sometimes.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        *Help > Diagnostics...* opens a report, and *Copy* there puts it on the clipboard: the versions of pycangui, Python, PySide6, python-can and canopen, the platform, each channel's adapter, state and load, what is being sent, and the state of each protocol. Paste it here. An adapter's description can include its serial number, and the report names your workspace folder and the files loaded; remove any of that if you would rather.
        If pycangui will not start at all, say so, and paste whatever it printed instead.
      render: text

  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - None -- a virtual channel or the demo device
        - IXXAT
        - Kvaser
        - PCAN
        - Vector
        - socketcan (Linux)
        - slcan or serial (CANable, Lawicel, USB2CAN)
        - Another -- say which above
    validations:
      required: true

  - type: dropdown
    id: installed
    attributes:
      label: Installed with
      options:
        - The Windows installer
        - The launcher (pycangui.cmd or pycangui.sh)
        - pip
        - A source checkout, for development
    validations:
      required: true

  - type: textarea
    id: event-log
    attributes:
      label: Event Log
      description: What the Event Log said around the time -- warnings and errors especially. A traceback is worth more than any description of one.
      render: text
