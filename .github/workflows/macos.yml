name: macOS

# On demand only: Actions tab > macOS > Run workflow, or
#
#   gh workflow run macos.yml
#
# pycangui does not claim macOS.  This is how to find out whether it could,
# without turning the badge on master red while the answer is still "not yet".
# The steps mirror the test job in ci.yml, less the lint (the same on every
# platform) and the Linux packages Qt needs there.
on:
  workflow_dispatch:
    inputs:
      python:
        description: Python version
        default: "3.14"

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ inputs.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon, which is what macos-latest is and most Macs now are,
        # and Intel alongside it for the machines still in use.
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -n auto tests

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pycangui --selftest
