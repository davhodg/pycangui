name: macOS

# Runs for every release tag, beside the Windows installer, and on demand:
# Actions tab > macOS > Run workflow, or
#
#   gh workflow run macos.yml
#
# Separate from ci.yml, so a failure here reports rather than blocks a release,
# and ordinary pushes do not wait for two Macs. The steps mirror the test job
# in ci.yml, less the lint (the same on every platform) and the Linux packages
# Qt needs there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      python:
        description: Python version
        default: "3.14"

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ inputs.python || '3.14' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon, which is what macos-latest is and most Macs now are,
        # and Intel alongside it for the machines still in use.
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python || '3.14' }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -n auto tests

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pycangui --selftest
