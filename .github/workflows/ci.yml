name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise.  The repository is public, so pull
# requests from forks run this workflow too, and no test needs to write.
permissions:
  contents: read

jobs:
  # Both ends of the supported range, but only where it earns its keep.  The
  # latest Python runs on both platforms, because platform differences (Qt,
  # threads, drivers) are what actually bite.  The oldest supported Python runs
  # on Linux only, which is the cheap runner: bugs that appear only on the
  # floor are real -- 3.12 and 3.13 evaluate annotations eagerly, which broke
  # the hook stubs while 3.14 hid it -- but they are rarely platform specific.
  # Windows minutes cost double, so there is no Windows job for the floor.
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.12" }  # the floor: requires-python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check pycangui tests build/check_build.py build/notices.py
          python -m ruff format --check pycangui tests

      # Qt needs a display.  The tests already ask for the offscreen platform,
      # but Linux runners also lack the X libraries Qt links against.
      - name: Install Qt's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        # -n auto: the suite is a thousand Qt tests and splits cleanly
        # across processes, which is seven times faster than in one.
        run: python -m pytest -q -n auto tests

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pycangui --selftest

  # The installer is only built for a release: a Windows runner costs double
  # the minutes, and nothing about the packaging changes between tags.  Push a
  # tag (git tag v0.1.0 && git push --tags) to produce and publish one, or run
  # the workflow by hand from the Actions tab.
  package:
    name: Windows installer
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # Publishing the release is the one write in the workflow.  The repository
    # gives the token read access by default, so without this a tag would
    # build the installer and then fail to publish it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # The hosted image usually has Inno Setup already; installing it anyway
      # keeps the build reproducible whichever image version is in use.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, check and package
        run: .\build.cmd

      - name: Check the licence guard actually ran
        run: python build\check_build.py

      - uses: actions/upload-artifact@v7
        with:
          name: pycangui-windows
          path: |
            dist/*-setup.exe
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

      # A tagged commit publishes the installer as a release asset.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*-setup.exe
            THIRD-PARTY-NOTICES.txt
            LICENSE
            NOTICE
