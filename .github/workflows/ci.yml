name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only the latest stable Python is tested, on both platforms: platform
  # differences are what actually bite (Qt, threads, drivers), and Actions
  # minutes are finite -- Windows runners cost double.  requires-python in
  # pyproject.toml is kept in step with this, so nothing is claimed untested.
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check pycangui tests build/check_build.py build/notices.py
          python -m ruff format --check pycangui tests

      # Qt needs a display.  The tests already ask for the offscreen platform,
      # but Linux runners also lack the X libraries Qt links against.
      - name: Install Qt's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Self test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pycangui --selftest

  package:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # The hosted image usually has Inno Setup already; installing it anyway
      # keeps the build reproducible whichever image version is in use.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, check and package
        run: .\build.cmd

      - name: Check the licence guard actually ran
        run: python build\check_build.py

      - uses: actions/upload-artifact@v4
        with:
          name: pycangui-windows
          path: |
            dist/*-setup.exe
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

      # A tagged commit publishes the installer as a release asset.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            THIRD-PARTY-NOTICES.txt
            LICENSE
            NOTICE
