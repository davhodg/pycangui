<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- SPDX-FileCopyrightText: 2026 davhodg -->
<!-- pycangui icon, 32 px and up: a CAN bus with four node taps and a zigzag
     terminating resistor at each end. Below 32 px the zigzag blurs into a
     bar, so pycangui_small.svg draws the bar on purpose. build/icon.py
     renders both into pycangui.ico and pycangui.png. -->
<rect x="0" y="0" width="256" height="256" rx="40" fill="#151b1d"/>
<!-- Each wire leaves the bus at a right angle and comes back in to meet one
     end of the resistor: CAN_H the top lead, CAN_L the bottom.  The turn is
     drawn as its own thinner line (13 against the bus's 20), because an
     elbow as heavy as the bus swamps the resistor beside it. -->
<path d="M50,118 V84 H28" fill="none" stroke="#2FD9C4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M206,118 V84 H228" fill="none" stroke="#2FD9C4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M50,138 V172 H28" fill="none" stroke="#F2924B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M206,138 V172 H228" fill="none" stroke="#F2924B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="46" y1="118" x2="210" y2="118" stroke="#2FD9C4" stroke-width="20"/>
<line x1="46" y1="138" x2="210" y2="138" stroke="#F2924B" stroke-width="20"/>
<!-- node taps -->
<line x1="82" y1="118" x2="82" y2="84" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="112" y1="138" x2="112" y2="206" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="146" y1="118" x2="146" y2="50" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="174" y1="138" x2="174" y2="172" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<rect x="66" y="60" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="96" y="206" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="130" y="26" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="158" y="172" width="32" height="24" rx="5" fill="#F2924B"/>
<!-- terminating resistors, drawn last: each lead starts on the wire's centre
     line, so the cream crosses the colour and the two read as joined. -->
<line x1="28" y1="84" x2="28" y2="98" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round"/>
<line x1="28" y1="158" x2="28" y2="172" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round"/>
<line x1="228" y1="84" x2="228" y2="98" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round"/>
<line x1="228" y1="158" x2="228" y2="172" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round"/>
<path d="M28,98 L17,108 L39,118 L17,128 L39,138 L17,148 L28,158" fill="none" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round" stroke-linejoin="miter"/>
<path d="M228,98 L239,108 L217,118 L239,128 L217,138 L239,148 L228,158" fill="none" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round" stroke-linejoin="miter"/>
</svg>
