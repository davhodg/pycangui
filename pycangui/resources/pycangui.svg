<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!-- SPDX-FileCopyrightText: 2026 davhodg -->
<!-- pycangui icon, 32 px and up: a CAN bus with four node taps and a zigzag
     terminating resistor at each end. Below 32 px the zigzag blurs into a
     bar, so pycangui_small.svg draws the bar on purpose. build/icon.py
     renders both into pycangui.ico and pycangui.png. -->
<rect x="0" y="0" width="256" height="256" rx="40" fill="#151b1d"/>
<!-- CAN_H and CAN_L; each meets its own inner peak of the resistor -->
<line x1="47" y1="118" x2="209" y2="118" stroke="#2FD9C4" stroke-width="20" stroke-linecap="round"/>
<line x1="47" y1="138" x2="209" y2="138" stroke="#F2924B" stroke-width="20" stroke-linecap="round"/>
<!-- node taps -->
<line x1="70" y1="118" x2="70" y2="84" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="108" y1="138" x2="108" y2="206" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="150" y1="118" x2="150" y2="50" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="188" y1="138" x2="188" y2="172" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<rect x="54" y="60" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="92" y="206" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="134" y="26" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="172" y="172" width="32" height="24" rx="5" fill="#F2924B"/>
<!-- terminating resistors: leads, then the zigzag drawn over the rail ends -->
<line x1="28" y1="78" x2="28" y2="98" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round"/>
<line x1="28" y1="158" x2="28" y2="178" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round"/>
<line x1="228" y1="78" x2="228" y2="98" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round"/>
<line x1="228" y1="158" x2="228" y2="178" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round"/>
<path d="M28,98 L17,108 L39,118 L17,128 L39,138 L17,148 L28,158" fill="none" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round" stroke-linejoin="miter"/>
<path d="M228,98 L239,108 L217,118 L239,128 L217,138 L239,148 L228,158" fill="none" stroke="#EDEAE2" stroke-width="8" stroke-linecap="round" stroke-linejoin="miter"/>
</svg>
