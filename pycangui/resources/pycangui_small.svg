<!-- pycangui icon, 24 px and below: pycangui.svg with each resistor drawn as
     a plain bar, which is what the zigzag becomes at this size anyway.  The
     wires still turn out to meet the bar's ends, at half the bus width
     rather than the large drawing's two thirds: at 24 px a heavier elbow
     covers the bar it is supposed to be terminating on. -->
<rect x="0" y="0" width="256" height="256" rx="40" fill="#151b1d"/>
<!-- CAN_H and CAN_L, turning out to the ends of each bar -->
<path d="M50,118 V84 H28" fill="none" stroke="#2FD9C4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M206,118 V84 H228" fill="none" stroke="#2FD9C4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M50,138 V172 H28" fill="none" stroke="#F2924B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M206,138 V172 H228" fill="none" stroke="#F2924B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="46" y1="118" x2="210" y2="118" stroke="#2FD9C4" stroke-width="20"/>
<line x1="46" y1="138" x2="210" y2="138" stroke="#F2924B" stroke-width="20"/>
<!-- node taps, at the same places as the large drawing -->
<line x1="82" y1="118" x2="82" y2="84" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="112" y1="138" x2="112" y2="206" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="146" y1="118" x2="146" y2="50" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<line x1="174" y1="138" x2="174" y2="172" stroke="#EDEAE2" stroke-width="12" stroke-linecap="round"/>
<rect x="66" y="60" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="96" y="206" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="130" y="26" width="32" height="24" rx="5" fill="#F2924B"/>
<rect x="158" y="172" width="32" height="24" rx="5" fill="#F2924B"/>
<!-- terminating resistors, matching the large drawing's extent -->
<rect x="20" y="84" width="16" height="88" rx="4" fill="#EDEAE2"/>
<rect x="220" y="84" width="16" height="88" rx="4" fill="#EDEAE2"/>
</svg>
