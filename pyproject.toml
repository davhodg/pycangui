[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycangui"
version = "0.0.1"
description = "User-friendly CAN bus tool: trace, transmit, CANopen, UDS, J1939, XCP, Python scripting"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
authors = [{ name = "davhodg" }]
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "python-can>=4.4",
    "canopen>=2.3",
    "cantools>=39",
    "numpy>=1.26",
    "udsoncan>=1.23",
    "can-isotp>=2.0",
    "can-j1939>=2.0",
    "pywin32>=306; sys_platform == 'win32'",  # can-j1939 imports pythoncom on Windows
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.*"]  # pinned: a new ruff must not break the build

[project.scripts]
pycangui = "pycangui.__main__:main"

[tool.setuptools.packages.find]
include = ["pycangui*"]

[tool.ruff]
line-length = 100
# Deliberately below requires-python.  Ruff otherwise formats to the newest
# syntax the floor allows -- on 3.14 that means PEP 758's parenthesis-free
# "except A, B:", which is unfamiliar and would stop the code parsing anywhere
# older.  The style stays portable; the package still requires 3.14 to run.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "RUF"]
ignore = [
    "N802",   # Qt overrides must be camelCase (rowCount, closeEvent, ...)
    "B008",   # QModelIndex() as a default argument is the standard Qt signature
]
